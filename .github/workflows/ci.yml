name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e . pytest

      - name: Run tests
        run: pytest

      - name: Validate contract
        run: ai-runtime-abi validate contracts/summarize_ticket.json

      - name: Run regression demo
        run: ai-runtime-abi run-demo contracts/summarize_ticket.json evals/golden_cases.jsonl
